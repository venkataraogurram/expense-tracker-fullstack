spring.application.name=expense-tracker

# Elastic Beanstalk's Java platform sets PORT=5000 and proxies nginx:80 to it.
# Locally PORT is unset, so the app listens on 8080.
server.port=${PORT:8080}

# --- Database -------------------------------------------------------------
# All values come from environment variables so the same jar runs locally
# (defaults below) and on AWS (set as Elastic Beanstalk environment properties).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:expense_tracker}?createDatabaseIfNotExist=true&useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:expense}
spring.datasource.password=${DB_PASSWORD:expense123}
spring.datasource.hikari.maximum-pool-size=5

# Hibernate creates/updates the `expenses` table from the @Entity on startup.
# Simple for a learning project; production apps would use Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# --- Web ------------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.problemdetails.enabled=false

# --- Actuator (used by health checks) -------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
